name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Run tests
        shell: powershell
        run: .\tests\run-tests.cmd
